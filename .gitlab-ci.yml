# ================================================================
# CI/CD — Portal del Registro Mercantil de Cuba
# Runner: shell en 10.10.3.22 (executor=shell, Docker nativo del host)
# ================================================================
stages:
  - deploy
  - health_check

variables:
  HARBOR_REGISTRY: registry.dev.xetid.cu/portales-web
  IMAGE_NAME: portal-rmc
  PREPROD_DIR: /opt/portal-mercantil
  PREPROD_PORT: "3003"

# ============================================================
# DEPLOY: override + pull + restart en servidor
# La imagen YA fue construida localmente y subida a Harbor.
# NO hay build en CI — el servidor no tiene internet.
# ============================================================
deploy_preprod:
  stage: deploy
  tags:
    - portal-rmc
  before_script:
    - '[ -f "$PREPROD_DIR/docker-compose.override.yml" ] && echo "Override existe, actualizando"'
    - echo "$HARBOR_PASSWORD" | docker login $HARBOR_REGISTRY -u "$HARBOR_USERNAME" --password-stdin
  script:
    - |
      echo "Generando docker-compose.override.yml..."
      echo "services:" > "$PREPROD_DIR/docker-compose.override.yml"
      echo "  app:" >> "$PREPROD_DIR/docker-compose.override.yml"
      echo "    image: ${HARBOR_REGISTRY}/${IMAGE_NAME}:latest" >> "$PREPROD_DIR/docker-compose.override.yml"
      echo "    build: {}" >> "$PREPROD_DIR/docker-compose.override.yml"
      echo "  postgres:" >> "$PREPROD_DIR/docker-compose.override.yml"
      echo "    image: ${HARBOR_REGISTRY}/postgres:15" >> "$PREPROD_DIR/docker-compose.override.yml"
      echo "    build: {}" >> "$PREPROD_DIR/docker-compose.override.yml"
      echo "  traefik:" >> "$PREPROD_DIR/docker-compose.override.yml"
      echo "    image: ${HARBOR_REGISTRY}/traefik:v3.0" >> "$PREPROD_DIR/docker-compose.override.yml"
      echo "    build: {}" >> "$PREPROD_DIR/docker-compose.override.yml"
      echo "Override generado"

      echo "Pulling imagen desde Harbor..."
      docker pull ${HARBOR_REGISTRY}/${IMAGE_NAME}:latest
      echo "Imagen pullada"

      echo "Reiniciando contenedor app..."
      cd "$PREPROD_DIR"
      docker compose up -d --no-deps app
      echo "Contenedor reiniciado"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  after_script:
    - docker logout $HARBOR_REGISTRY 2>/dev/null || true

# ============================================================
# HEALTH CHECK: verificar que la app responde
# ============================================================
health_check:
  stage: health_check
  tags:
    - portal-rmc
  script:
    - |
      echo "Esperando que la app levante (/api/health)..."
      for i in $(seq 1 30); do
        if curl -fsS "http://127.0.0.1:${PREPROD_PORT}/api/health" 2>/dev/null | grep -q '"status":"ok"'; then
          echo "Health check passed en intento $i"
          exit 0
        fi
        echo "  Intento $i/30 — esperando..."
        sleep 5
      done
      echo "Health check failed - la app no responde"
      docker logs registro-mercantil-app --tail 30
      exit 1
  needs:
    - deploy_preprod
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ============================================================
# SERVER LOGS: diagnóstico remoto sin SSH
# Muestra las últimas 50 líneas del contenedor app tras el deploy.
# ============================================================
server_logs:
  stage: health_check
  tags:
    - portal-rmc
  script:
    - |
      echo "=== Ultimas 50 lineas del log de app ==="
      docker logs registro-mercantil-app --tail 50 2>&1 || true
  needs:
    - deploy_preprod
  when: always
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ============================================================
# DB BACKUP: pg_dump del contenedor postgres (manual)
# Permite backup de BD sin SSH al servidor.
# ============================================================
db_backup:
  stage: health_check
  tags:
    - portal-rmc
  script:
    - |
      echo "=== Backup de PostgreSQL ==="
      TIMESTAMP=$(date +%Y%m%d_%H%M%S)
      BACKUP_DIR="/opt/portal-mercantil/backups"
      BACKUP_FILE="${BACKUP_DIR}/backup_${TIMESTAMP}.sql"
      mkdir -p "${BACKUP_DIR}"
      docker exec registro-mercantil-postgres pg_dump -U portal_rmc -d registro_mercantil > "${BACKUP_FILE}"
      echo "Backup guardado en: ${BACKUP_FILE}"
      ls -lh "${BACKUP_FILE}"
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ============================================================
# RESTART APP: reinicio manual del contenedor app (manual)
# Util para recargar config o recuperar de estado degradado.
# ============================================================
restart_app:
  stage: health_check
  tags:
    - portal-rmc
  script:
    - |
      echo "=== Reiniciando contenedor app ==="
      cd /opt/portal-mercantil
      docker compose restart app
      echo "Esperando health check..."
      for i in $(seq 1 15); do
        if curl -fsS "http://127.0.0.1:3003/api/health" 2>/dev/null | grep -q '"status":"ok"'; then
          echo "App reiniciada y saludable en intento $i"
          exit 0
        fi
        sleep 3
      done
      echo "WARN: health check no paso tras reinicio, revisar logs"
      docker logs registro-mercantil-app --tail 30
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ============================================================
# ROLLBACK: revertir a una imagen anterior de Harbor (manual)
# Uso: pasar IMAGE_TAG con el tag de la imagen a revertir
# ============================================================
rollback_app:
  stage: health_check
  tags:
    - portal-rmc
  variables:
    IMAGE_TAG: "${IMAGE_TAG:-latest}"
  script:
    - |
      echo "=== Rollback a imagen ${IMAGE_TAG} ==="
      echo "$HARBOR_PASSWORD" | docker login $HARBOR_REGISTRY -u "$HARBOR_USERNAME" --password-stdin
      docker pull ${HARBOR_REGISTRY}/portal-rmc:${IMAGE_TAG}
      cd /opt/portal-mercantil
      cat > docker-compose.override.yml <<EOF
services:
  app:
    image: ${HARBOR_REGISTRY}/portal-rmc:${IMAGE_TAG}
    build: {}
EOF
      docker compose up -d --no-deps app
      echo "Esperando health check tras rollback..."
      for i in $(seq 1 20); do
        if curl -fsS "http://127.0.0.1:3003/api/health" 2>/dev/null | grep -q '"status":"ok"'; then
          echo "Rollback completado exitosamente (versión ${IMAGE_TAG})"
          exit 0
        fi
        sleep 5
      done
      echo "WARN: health check no pasó tras rollback"
      docker logs registro-mercantil-app --tail 30
      exit 1
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
