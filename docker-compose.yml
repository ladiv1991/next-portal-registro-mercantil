services:
  app:
    build:
      args:
          DOCKER_REGISTRY: ${DOCKER_REGISTRY}
          HTTP_PROXY: ${HTTP_PROXY:-}
          HTTPS_PROXY: ${HTTP_PROXY:-}
          NO_PROXY: 'localhost,127.0.0.1,::1,*.local,deb.debian.org,security.debian.org'
      context: .
      dockerfile: Dockerfile
    container_name: registro-mercantil-app
    environment:
      DATABASE_URL: postgresql://portal_rmc:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_is_required}@10.66.0.3:5432/registro_mercantil
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET_is_required}
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORTAL_SCHEME: ${PORTAL_SCHEME:-http}
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-portal-registromercantil.test.xutil.cu}
      PORTAL_DOMAINS: ${PORTAL_DOMAINS:-portal-registromercantil.test.xutil.cu,portal-registromercantil.egob.dev.xetid.cu}
      NEXT_PUBLIC_APP_URL: ${PORTAL_SCHEME:-http}://${PORTAL_DOMAIN:-portal-registromercantil.test.xutil.cu}
      SMTP_HOST: m11-mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: noreply@registromercantil.cu
      UPLOAD_MAX_FILE_MB: ${UPLOAD_MAX_FILE_MB:-5}
      UPLOAD_MAX_IMAGE_MB: ${UPLOAD_MAX_IMAGE_MB:-5}
      UPLOAD_MAX_DOCUMENT_MB: ${UPLOAD_MAX_DOCUMENT_MB:-20}
      UPLOAD_MAX_VIDEO_MB: ${UPLOAD_MAX_VIDEO_MB:-100}
    ports:
      - "3003:3000"
    depends_on:
      - postgres
    restart: unless-stopped
    # Conectar a la red del entorno multisitios para alcanzar Mailpit (SMTP)
    networks:
      - next-portal-registro-mercantil_default
      - multisitios11_drupalnet
    # Traefik labels — wildcard HostRule para múltiples dominios
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rmc-app.rule=Host(`${PORTAL_DOMAINS:-localhost}`)"
      - "traefik.http.routers.rmc-app.entrypoints=web"
      - "traefik.http.services.rmc-app.loadbalancer.server.port=3000"
      # soporte HTTPS si se configura
      - "traefik.http.routers.rmc-app-ssl.rule=Host(`${PORTAL_DOMAINS:-localhost}`)"
      - "traefik.http.routers.rmc-app-ssl.entrypoints=websecure"
      - "traefik.http.routers.rmc-app-ssl.tls=true"

  traefik:
    image: ${DOCKER_REGISTRY}traefik:v3.0
    container_name: registro-mercantil-traefik
    command:
      # API dashboard DESHABILITADO - usar auth real (Basic auth + TLS)
      - "--api=true"
      - "--api.dashboard=false"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:8081"
    ports:
      - "8082:8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  postgres:
    image: ${DOCKER_REGISTRY}postgres:15
    container_name: registro-mercantil-postgres
    environment:
      POSTGRES_USER: portal_rmc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_is_required}
      POSTGRES_DB: registro_mercantil
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

networks:
  next-portal-registro-mercantil_default:
    driver: bridge
  multisitios11_drupalnet:
    external: true

volumes:
  postgres_data:
